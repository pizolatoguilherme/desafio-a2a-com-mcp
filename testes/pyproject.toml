[project]
name = "central-de-salas-testes"
version = "1.0.0"
description = "Testes da entrega: sobem os dois processos de verdade e falam HTTP com eles"
requires-python = ">=3.10"
dependencies = [
    "pytest==9.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# So as dependencias sao instaladas; os testes rodam direto da pasta.
[tool.setuptools]
py-modules = []
