[project]
name = "central-de-salas-agente"
version = "1.0.0"
description = "Agente A2A (JSON-RPC) que e host MCP por dentro. Sem LLM."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# So as dependencias sao instaladas; o codigo roda direto da pasta.
[tool.setuptools]
py-modules = []
